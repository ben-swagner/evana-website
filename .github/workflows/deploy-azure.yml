# Produktion: Build hochladen nach Azure Storage (Static Website) und Front Door Cache leeren.
# Vorerst nur manuell auslösbar. Benötigte Secrets:
#   AZURE_CREDENTIALS        Service Principal (JSON) mit Rechten auf Storage und Front Door
#   AZURE_STORAGE_ACCOUNT    Name des Storage Accounts
#   AZURE_RESOURCE_GROUP     Resource Group von Front Door
#   AZURE_FRONTDOOR_PROFILE  Name des Front-Door-Profils
#   AZURE_FRONTDOOR_ENDPOINT Name des Front-Door-Endpunkts
name: Deploy Produktion (Azure)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:text
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Upload nach Azure Storage
        run: |
          az storage blob sync \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --container '$web' \
            --source dist \
            --delete-destination true \
            --auth-mode login
      - name: Front Door Cache leeren
        run: |
          az afd endpoint purge \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ secrets.AZURE_FRONTDOOR_PROFILE }}" \
            --endpoint-name "${{ secrets.AZURE_FRONTDOOR_ENDPOINT }}" \
            --content-paths '/*'
